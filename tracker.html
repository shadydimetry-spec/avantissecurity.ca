<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Checklist — Avantis Security</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2028; --panel:#232933; --panel-2:#2A313C; --line:#3A4250;
    --silver:#C7CFD6; --silver-dim:#8F98A3; --gold:#D9A93D; --gold-btn:#C79A3C; --gold-dim:#A8823A;
    --text:#F1F3F5; --text-dim:#AEB6BF; --radius:2px; --good:#7FBF8F; --warn:#E2A83D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--text); font-family:'Inter',sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,.disp{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.01em; text-transform:uppercase; color:var(--text);}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--gold); text-decoration:underline;}
  .wrap{max-width:780px; margin:0 auto; padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px;}}

  header{position:sticky; top:0; z-index:50; background:rgba(27,32,40,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .nav-wrap{max-width:1180px; margin:0 auto; padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:76px;}
  @media(max-width:640px){ .nav-wrap{padding:0 20px;} }
  .back-link{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.08em; color:var(--text-dim); text-transform:uppercase; text-decoration:none; display:flex; align-items:center; gap:8px;}
  .back-link:hover{color:var(--gold);}

  .page-hero{padding:56px 0 20px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.12em; color:var(--gold-dim); text-transform:uppercase; margin-bottom:12px;}
  .page-hero h1{font-size:clamp(28px,4.6vw,38px); line-height:1.05;}
  .page-hero p{color:var(--text-dim); font-size:14.5px; margin-top:14px;}

  .progress-bar-wrap{margin:28px 0 8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); height:8px; overflow:hidden;}
  .progress-bar{height:100%; background:var(--gold-btn); width:0%; transition:width .3s;}
  .progress-label{font-size:12.5px; color:var(--text-dim); margin-bottom:36px;}
  .progress-label .mono{color:var(--text);}

  .group{margin-bottom:44px;}
  .group-title{
    display:flex; align-items:center; gap:10px; font-size:13px; letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:16px; font-family:'JetBrains Mono',monospace;
  }
  .group-title.must{color:var(--warn);}
  .group-title.soon{color:var(--silver);}
  .group-title.later{color:var(--text-dim);}
  .group-title::before{content:""; width:16px; height:1px; background:currentColor;}

  .item{
    display:flex; align-items:flex-start; gap:14px; padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item input[type="checkbox"]{
    appearance:none; width:20px; height:20px; flex-shrink:0; margin-top:1px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    cursor:pointer; position:relative;
  }
  .item input[type="checkbox"]:checked{ background:var(--gold-btn); border-color:var(--gold-btn); }
  .item input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:6px; top:2px; width:5px; height:10px;
    border:solid var(--ink); border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .item label{font-size:14.5px; color:var(--text); cursor:pointer;}
  .item.done label{color:var(--text-dim); text-decoration:line-through;}
  .item .note{font-size:12.5px; color:var(--text-dim); margin-top:4px;}

  .reset-row{margin-top:20px; padding-bottom:80px;}
  .reset-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
    background:none; border:1px solid var(--line); padding:8px 14px; border-radius:var(--radius);
    cursor:pointer; letter-spacing:0.05em;
  }
  .reset-btn:hover{color:var(--text); border-color:var(--silver-dim);}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="back-link">&larr; Back to home</a>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <div class="tag">Internal — not for public site</div>
      <h1>Launch checklist</h1>
      <p>Progress saves automatically in this browser. Check items off as you complete them.</p>

      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-label"><span class="mono" id="progressText">0 / 0</span> items complete</div>
    </div>
  </section>

  <section class="wrap">

    <div class="group">
      <div class="group-title must">Must-do before launch</div>
      <div id="group-must"></div>
    </div>

    <div class="group">
      <div class="group-title soon">Should-do soon after launch</div>
      <div id="group-soon"></div>
    </div>

    <div class="group">
      <div class="group-title later">Nice-to-have, no rush</div>
      <div id="group-later"></div>
    </div>

    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Reset checklist</button>
    </div>

  </section>
</main>

<script>
  var items = [
    { id:'pay', group:'must', text:'Connect a payment processor (Stripe/Moneris/Helcim/Square + PayPal) so checkout can actually charge people' },
    { id:'forms', group:'must', text:'Connect a backend to the apply, quote, and checkout forms (email service, CRM, or ATS)' },
    { id:'placeholders', group:'must', text:'Replace every placeholder: phone number, email, address/region, testimonial attribution' },
    { id:'legal', group:'must', text:'Have the Privacy Policy and Terms of Service reviewed by a lawyer' },
    { id:'hosting', group:'must', text:'Set up hosting + DNS for avantissecurity.ca, get SSL, and add the 301 redirect from the old domain' },
    { id:'french', group:'must', text:'Have a native French speaker review the FR copy sitewide' },

    { id:'photos', group:'soon', text:'Real product photos (currently placeholder boxes on the shop page)' },
    { id:'team', group:'soon', text:'Real team names and photos in the leadership section' },
    { id:'testimonials', group:'soon', text:'More real client testimonials' },
    { id:'license', group:'soon', text:'Display BSP agency license number / insurance info for credibility' },

    { id:'productpages', group:'later', text:'Individual product detail pages' },
    { id:'blog', group:'later', text:'Blog / resources section' },
    { id:'map', group:'later', text:'Service-area coverage map' },
    { id:'social', group:'later', text:'Google Business Profile, social handles set up' }
  ];

  var STORAGE_KEY = 'avantisLaunchChecklist';

  function getState(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var groups = { must: document.getElementById('group-must'), soon: document.getElementById('group-soon'), later: document.getElementById('group-later') };
  var state = getState();

  items.forEach(function(item){
    var row = document.createElement('div');
    row.className = 'item' + (state[item.id] ? ' done' : '');
    row.innerHTML =
      '<input type="checkbox" id="chk-' + item.id + '"' + (state[item.id] ? ' checked' : '') + '>' +
      '<label for="chk-' + item.id + '">' + item.text + '</label>';
    groups[item.group].appendChild(row);
  });

  function updateProgress(){
    var total = items.length;
    var done = items.filter(function(i){ return state[i.id]; }).length;
    document.getElementById('progressText').textContent = done + ' / ' + total;
    document.getElementById('progressBar').style.width = (total ? (done / total * 100) : 0) + '%';
  }

  document.body.addEventListener('change', function(e){
    if(e.target.type !== 'checkbox'){ return; }
    var id = e.target.id.replace('chk-', '');
    state[id] = e.target.checked;
    saveState(state);
    e.target.closest('.item').classList.toggle('done', e.target.checked);
    updateProgress();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    state = {};
    saveState(state);
    document.querySelectorAll('.item input[type="checkbox"]').forEach(function(cb){
      cb.checked = false;
      cb.closest('.item').classList.remove('done');
    });
    updateProgress();
  });

  updateProgress();
</script>

</body>
</html>
